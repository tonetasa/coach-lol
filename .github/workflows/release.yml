name: Instalador

# A cada push na main: monta o instalador no Windows e guarda como artefato.
# Se a VERSAO de versao.py ainda não tem Release, publica a Release v<VERSAO>
# com o CoachLoL-Setup-<versão>.exe. O app instalado detecta e se atualiza.
# (Para lançar uma versão nova, basta mudar VERSAO e fazer push.)
on:
  push:
    branches: [main]
    paths-ignore: ["builds.json", "README.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Dependências
        run: python -m pip install --upgrade pyinstaller -r requirements.txt

      - name: Versão
        id: versao
        shell: bash
        run: |
          VER=$(python gerar_info_versao.py)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - name: Executável
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name CoachLoL
          --icon icone.ico --version-file version_info.txt --add-data "icone.ico;."
          --hidden-import pyttsx3.drivers --hidden-import pyttsx3.drivers.sapi5
          --collect-submodules comtypes --collect-all vosk --collect-all sounddevice
          --collect-all customtkinter --hidden-import pystray._win32
          --hidden-import keyring.backends.Windows
          coach_app.py

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Q "/DAppVersion=${{ steps.versao.outputs.ver }}" CoachLoL.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Guardar instalador (teste)
        uses: actions/upload-artifact@v4
        with:
          name: CoachLoL-Setup-${{ steps.versao.outputs.ver }}
          path: instalador/*.exe

      - name: Release já existe?
        id: existe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.versao.outputs.ver }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "sim=true" >> "$GITHUB_OUTPUT"
          else
            echo "sim=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar release
        if: github.ref == 'refs/heads/main' && steps.existe.outputs.sim == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.ver }}
          name: Coach LoL ${{ steps.versao.outputs.ver }}
          target_commitish: ${{ github.sha }}
          files: instalador/*.exe
          generate_release_notes: true
